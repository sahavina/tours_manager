# Bản Supabase chạy local cho SAHA Tour Hub. Cổng lệch hẳn khỏi keodansaha (54321/54322) để hai dự
# án chạy song song trên cùng máy.
project_id = "saha-tour-hub"

[api]
port = 55421
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
site_url = "http://localhost:3101"
additional_redirect_urls = ["http://localhost:3101"]
# Tài khoản nội bộ do quản trị viên tạo, không có đăng ký công khai.
enable_signup = false

[auth.email]
enable_signup = true
enable_confirmations = false
